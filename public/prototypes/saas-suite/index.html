<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收单综合管理 SaaS平台</title>
  <link rel="icon" type="image/svg+xml" href="acquiring-mark.svg">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard"><img src="acquiring-mark.svg" alt=""><strong>收单综合管理<br>SaaS平台</strong></a>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="side-foot"><span class="online"></span>测试环境 <span>V1.1</span></div>
    </aside>
    <div class="workspace">
      <header class="header">
        <button class="icon-btn menu-toggle" id="menuToggle" title="展开或收起菜单" aria-label="展开或收起菜单">☰</button>
        <div id="breadcrumb">工作台</div>
        <div class="header-tools">
          <div class="global-search"><input id="globalSearch" aria-label="搜索菜单或业务记录" placeholder="搜索菜单、商户、业务订单"><div id="searchResults" hidden></div></div>
          <span class="env">测试环境</span>
          <label class="identity"><span class="avatar" id="avatar">管</span><select id="identity" aria-label="当前身份"><option value="admin">管理员</option><option value="operator">运营</option><option value="reviewer">审核员</option><option value="finance">财务</option><option value="merchant">商户操作员</option></select></label>
        </div>
      </header>
      <main id="content" tabindex="-1"></main>
      <footer class="page-footer">收单综合管理 SaaS平台 · 测试环境</footer>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" role="status" class="toast" hidden></div>
  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="prototype.js"></script>
</body>
</html>
