<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>房产客户档案与交易履约CRM系统 - HTML 交互原型</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --line: #d9e1ec;
      --text: #182230;
      --muted: #667085;
      --primary: #1769e0;
      --primary-dark: #124c9f;
      --primary-soft: #eaf2ff;
      --ok: #027a48;
      --ok-bg: #ecfdf3;
      --warn: #b54708;
      --warn-bg: #fff7e6;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --gray-bg: #f8fafc;
      --shadow: 0 14px 34px rgba(16, 24, 40, 0.10);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .prototype-note {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 8px 20px;
      color: #fff;
      background: #111827;
      font-size: 13px;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: linear-gradient(135deg, #eef4ff, #f8fafc 48%, #edfdf6);
    }

    .login-card {
      width: min(460px, 100%);
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 29px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand strong {
      font-size: 18px;
      white-space: nowrap;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .layout {
      display: grid;
      grid-template-columns: 236px 1fr;
      min-height: 0;
    }

    .sidebar {
      padding: 16px 12px;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .nav-group {
      margin-bottom: 18px;
    }

    .nav-title {
      padding: 0 10px 8px;
      color: #98a2b3;
      font-size: 12px;
      font-weight: 700;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 11px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #344054;
      text-align: left;
      margin-bottom: 5px;
    }

    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .nav-count {
      min-width: 24px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #667085;
      font-size: 12px;
      text-align: center;
    }

    main {
      padding: 22px;
      overflow: auto;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .page-head h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .page-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      min-height: 104px;
      padding: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stat span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong {
      display: block;
      font-size: 27px;
      line-height: 1;
    }

    .stat em {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-style: normal;
    }

    .panel {
      margin-bottom: 16px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .panel-body {
      padding: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .toolbar input, .toolbar select {
      min-width: 210px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }

    th {
      color: #475467;
      background: #f8fafc;
      font-size: 13px;
    }

    tr:hover td { background: #fbfdff; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.danger { background: var(--danger-bg); color: var(--danger); }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.info { background: var(--primary-soft); color: var(--primary-dark); }
    .badge.gray { background: #f2f4f7; color: #475467; }

    .primary-btn, .ghost-btn, .danger-btn, .small-btn {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
    }

    .primary-btn { color: #fff; background: var(--primary); }
    .primary-btn:hover { background: var(--primary-dark); }
    .ghost-btn { color: var(--text); background: #fff; border-color: var(--line); }
    .danger-btn { color: var(--danger); background: var(--danger-bg); border-color: #ffd0cc; }
    .small-btn { padding: 6px 10px; background: #fff; border-color: var(--line); font-size: 13px; }

    .split {
      display: grid;
      grid-template-columns: minmax(360px, 0.9fr) minmax(500px, 1.1fr);
      gap: 16px;
      align-items: start;
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .info-item {
      min-height: 70px;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .info-item span {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .info-item strong { font-size: 14px; }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .step {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .step-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .step-title strong { font-size: 14px; }

    .step p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .doc-list {
      display: grid;
      gap: 10px;
    }

    .doc-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .doc-row div { min-width: 0; }
    .doc-row strong, .doc-row span { display: block; }
    .doc-row span {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      color: #344054;
      font-size: 13px;
      font-weight: 600;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .field textarea {
      min-height: 86px;
      resize: vertical;
    }

    .full { grid-column: 1 / -1; }

    .queue {
      display: grid;
      gap: 10px;
    }

    .queue-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .queue-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .queue-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .mini-chart {
      display: grid;
      gap: 10px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 108px 1fr 38px;
      gap: 10px;
      align-items: center;
      color: #475467;
      font-size: 13px;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: #eef2f6;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .config-list {
      display: grid;
      gap: 12px;
    }

    .config-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .config-row strong { display: block; margin-bottom: 4px; }
    .config-row span { color: var(--muted); font-size: 13px; }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      max-width: 360px;
      padding: 12px 14px;
      color: #fff;
      background: #111827;
      border-radius: 8px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      .stats { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .split, .three-col, .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .topbar, .page-head { align-items: stretch; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .nav-group { margin: 0; }
      .nav-title { display: none; }
      main { padding: 14px; }
      .stats, .form-grid, .info-grid { grid-template-columns: 1fr; }
      .doc-row, .queue-item { grid-template-columns: 1fr; }
      th, td { white-space: normal; }
    }
  </style>
</head>

      const filtered = cases.filter(item => {
        const haystack = [item.room, item.buyer, item.coBuyers.join(","), item.phone, item.idCard, item.payment, item.handler, getStatus(item)].join(" ");

          <div class="panel"><div class="panel-head"><h3>流程分布</h3></div><div class="panel-body"><div class="mini-chart">${renderStatusBars()}</div></div></div>
          <div class="panel"><div class="panel-head"><h3>经办人负载</h3></div><div class="panel-body"><div class="mini-chart">${renderHandlerBars()}</div></div></div>
          <div class="panel"><div class="panel-head"><h3>资料类型缺失</h3></div><div class="panel-body"><div class="mini-chart">${renderMissingDocBars()}</div></div></div>
        </div>
      `;
    }

    function renderCreatePage() {
      document.getElementById("createPage").innerHTML = `
        <div class="page-head">
          <div><h2>新增房号档案</h2><p>原型中保存后写入页面内存，用于演示从选房确认到建档的流程。</p></div>
          <button class="ghost-btn" onclick="showPage('cases')">返回列表</button>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>房源与购房人信息</h3></div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="field"><label>项目名称</label><input id="newProject" value="星河湾一期演示项目" /></div>
              <div class="field"><label>楼栋</label><input id="newBuilding" value="2号楼" /></div>
              <div class="field"><label>单元</label><input id="newUnit" value="1单元" /></div>
              <div class="field"><label>房号</label><input id="newRoom" value="0201" /></div>
              <div class="field"><label>建筑面积</label><input id="newArea" value="105.0m2" /></div>
              <div class="field"><label>付款方式</label><select id="newPayment"><option>贷款</option><option>全款</option></select></div>
              <div class="field"><label>房款总额</label><input id="newTotalAmount" value="1200000" /></div>
              <div class="field"><label>已确认款项</label><input id="newDepositAmount" value="0" /></div>
              <div class="field"><label>购房人姓名</label><input id="newBuyerName" value="演示客户" /></div>
              <div class="field"><label>共同购房人</label><input id="newCoBuyers" value="共同客户" /></div>
              <div class="field"><label>性别</label><select id="newGender"><option>男</option><option>女</option></select></div>
              <div class="field"><label>手机号</label><input id="newPhone" value="13800138000" /></div>
              <div class="field"><label>身份证号</label><input id="newIdCard" value="110101199001011234" /></div>
              <div class="field"><label>经办人</label><select id="newHandler"><option>王敏</option><option>赵倩</option></select></div>
              <div class="field full"><label>建档备注</label><textarea id="newRemark">购房者已选房，开始收集购房资料。</textarea></div>
            </div>
            <button class="primary-btn" onclick="createCase()">保存档案</button>
          </div>
        </div>
      `;
    }

    function renderSettingsPage() {
      document.getElementById("settingsPage").innerHTML = `
        <div class="page-head">
          <div><h2>设置与备份</h2><p>展示正式使用前需要考虑的本地资料库、备份策略、安全配置和内网部署项。</p></div>
          <button class="primary-btn" onclick="createBackup()">创建备份</button>
        </div>
        <div class="two-col">
          <div class="panel">
            <div class="panel-head"><h3>备份记录</h3></div>
            <div class="panel-body">
              <table><thead><tr><th>备份时间</th><th>备份文件</th><th>大小</th><th>状态</th></tr></thead>
              <tbody>${backups.map(item => `<tr><td>${item.time}</td><td>${item.file}</td><td>${item.size}</td><td>${badge(item.status)}</td></tr>`).join("")}</tbody></table>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h3>系统配置</h3></div>
            <div class="panel-body">
              <div class="config-list">
                <div class="config-row"><div><strong>资料库位置</strong><span>F:\\HomeInformationManagementSystem\\storage\\资料库</span></div>${badge("已配置")}</div>
                <div class="config-row"><div><strong>身份证脱敏</strong><span>列表页仅展示前 6 位和后 4 位。</span></div>${badge("已开启")}</div>
                <div class="config-row"><div><strong>自动备份</strong><span>建议正式使用时每日下班后自动备份。</span></div>${badge("待配置")}</div>
                <div class="config-row"><div><strong>操作日志</strong><span>正式使用时记录资料上传、状态变更和敏感信息查看。</span></div>${badge("待增强")}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderModuleTable(rows, focusTitle, focusText, actionHtml) {
      return `
        <table>
          <thead><tr><th>房号</th><th>购房人</th><th>手机号</th><th>付款方式</th><th>${focusTitle}</th><th>总体状态</th><th>下一步</th><th>操作</th></tr></thead>
          <tbody>
            ${rows.map(item => `
              <tr>
                <td>${item.room}</td><td>${item.buyer}</td><td>${item.phone}</td><td>${item.payment}</td>
                <td>${focusText(item)}</td><td>${badge(getStatus(item))}</td><td>${item.nextAction}</td><td>${actionHtml(item)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderHandlerBars() {
      const names = [...new Set(cases.map(c => c.handler))];
      const max = Math.max(...names.map(name => cases.filter(c => c.handler === name).length), 1);
      return names.map(name => {
        const value = cases.filter(c => c.handler === name).length;
        return `<div class="bar-row"><span>${name}</span><div class="bar"><i style="width:${value / max * 100}%"></i></div><strong>${value}</strong></div>`;
      }).join("");
    }

    function renderMissingDocBars() {
      const rows = requiredDocs.map(doc => [doc, cases.filter(c => missingDocs(c).includes(doc)).length]);
      const max = Math.max(...rows.map(row => row[1]), 1);
      return rows.map(([label, value]) => `<div class="bar-row"><span>${label}</span><div class="bar"><i style="width:${value / max * 100}%"></i></div><strong>${value}</strong></div>`).join("");
    }

    function toggleStep(key, doneValue) {
      const item = getSelectedCase();
      const undone = {
        deposit_status: "未确认",
        agreement_status: "未签",
        documents_status: "待收集资料",
        topping_out_status: "不展示",
        final_payment_status: "未确认",
        online_signing_status: "未办理",
        certificate_status: "未领取",
        owner_notification_status: "未通知",
        payment_status: "未确认",
        completion_status: "未结束"
      };
      if (key === "payment_status") {
        const nextValue = workflowValue(item, key) === doneValue ? "未确认" : doneValue;
        item.workflow.deposit_status = nextValue;
        item.workflow.final_payment_status = nextValue;
      } else if (key === "completion_status") {
        const done = workflowValue(item, key) !== doneValue;
        item.workflow.owner_notification_status = done ? "已通知" : "未通知";
      } else {
        item.workflow[key] = workflowValue(item, key) === doneValue ? undone[key] : doneValue;
      }
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 手动更新${workflowLabels.find(row => row[0] === key)[1]}为：${workflowValue(item, key)}。`);
      renderDetail();
      renderNavCounts();
      toast(`已更新：${getStatus(item)}`);
    }

    function uploadMockDocument() {
      const item = getSelectedCase();
      const nextName = `补充资料-${item.docs.length + 1}.pdf`;
      item.docs.push(nextName);
      syncDocumentStatus(item);
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 已模拟上传：${nextName}。`);
      renderDetail();
      renderNavCounts();
      toast(`已模拟上传：${nextName}`);
    }

    function addDoc(type) {
      const item = getSelectedCase();
      const fileName = `${type}.pdf`;
      if (!item.docs.includes(fileName)) item.docs.push(fileName);
      syncDocumentStatus(item);
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 已补充${type}。`);
      renderDetail();
      renderNavCounts();
      toast(`已补充${type}`);
    }

    function confirmPayment(id) {
      const item = cases.find(c => c.id === id);
      item.workflow.deposit_status = "已确认";
      item.workflow.final_payment_status = "已确认";
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 财务通知款项已到账。`);
      renderPaymentsPage();
      renderNavCounts();
      toast("已模拟财务确认款项到账");
    }

    function completeSigning(id) {
      const item = cases.find(c => c.id === id);
      item.workflow.online_signing_status = "已办结";
      if (!item.docs.includes("网签合同.pdf")) item.docs.push("网签合同.pdf");
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 政务大厅网签已办结，网签合同已归档。`);
      renderSigningPage();
      renderNavCounts();
      toast("已模拟办结网签");
    }

    function completeCertificateStep(id) {
      const item = cases.find(c => c.id === id);
      if (item.workflow.certificate_status !== "已领取") {
        item.workflow.certificate_status = "已领取";
        if (!item.docs.includes("房产证领取记录.pdf")) item.docs.push("房产证领取记录.pdf");
        item.logs.unshift(`${nowText()} 已批量领取房产证。`);
      } else {
        item.workflow.owner_notification_status = "已通知";
        item.logs.unshift(`${nowText()} 已通知业主领取房产证。`);
      }
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      renderCertificatesPage();
      renderNavCounts();
      toast("已推进房产证处理状态");
    }

    function fastForward(id) {
      const item = cases.find(c => c.id === id);
      const steps = [
        ["documents_status", "资料已满足"],
        ["agreement_status", "已签"],
        ["payment_status", "已确认"],
        ["online_signing_status", "已办结"],
        ["certificate_status", "已领取"],
        ["owner_notification_status", "已通知"],
        ["completion_status", "已结束"]
      ];
      const next = steps.find(([key, done]) => workflowValue(item, key) !== done);
      if (!next) {
        toast("该档案已经完成");
        return;
      }
      if (next[0] === "payment_status") {
        item.workflow.deposit_status = "已确认";
        item.workflow.final_payment_status = "已确认";
      } else if (next[0] === "completion_status") {
        item.workflow.owner_notification_status = "已通知";
      } else {
        item.workflow[next[0]] = next[1];
      }
      if (next[0] === "documents_status") {
        requiredDocs.forEach(doc => {
          const fileName = `${doc}.pdf`;
          if (!item.docs.includes(fileName)) item.docs.push(fileName);
        });
      }
      item.updatedAt = nowText();
      item.nextAction = nextActionText(item);
      item.logs.unshift(`${nowText()} 快速推进节点：${next[1]}。`);
      renderDetail();
      renderNavCounts();
      toast(`已推进到：${getStatus(item)}`);
    }

    function createCase() {
      const room = [val("newBuilding"), val("newUnit"), val("newRoom")].filter(Boolean).join("-");
      const totalAmount = Number(val("newTotalAmount")) || 0;
      const depositAmount = Number(val("newDepositAmount")) || 0;
      const item = {
        id: Date.now(),
        project: val("newProject"),
        room,
        area: val("newArea"),
        totalAmount,
        depositAmount,
        finalAmount: Math.max(totalAmount - depositAmount, 0),
        buyer: val("newBuyerName"),
        coBuyers: val("newCoBuyers") ? val("newCoBuyers").split(/[、,，]/).filter(Boolean) : [],
        gender: val("newGender"),
        phone: val("newPhone"),
        idCard: val("newIdCard"),
        payment: val("newPayment"),
        handler: val("newHandler"),
        updatedAt: nowText(),
        nextAction: "收集购房人资料",
        docs: [],
        workflow: {
          deposit_status: "未确认",
          agreement_status: "未签",
          documents_status: "待收集资料",
          topping_out_status: "不展示",
          final_payment_status: "未确认",
          online_signing_status: "未办理",
          certificate_status: "未领取",
          owner_notification_status: "未通知"
        },
        logs: [`${nowText()} ${val("newRemark") || "新增档案。"} `]
      };
      cases.unshift(item);
      selectedCaseId = item.id;
      renderNavCounts();
      showPage("detail");
      toast("新增档案成功，当前为待收集资料");
    }

    function createBackup() {
      backups.unshift({
        time: nowText(),
        file: `房产客户档案与交易履约CRM系统-${compactTime()}.zip`,
        size: `${180 + backups.length * 6} MB`,
        status: "成功"
      });
      renderSettingsPage();
      renderNavCounts();
      toast("已创建一条演示备份记录");
    }

    function clearSearch() {
      const keyword = document.getElementById("keyword");
      const filter = document.getElementById("statusFilter");
      if (keyword) keyword.value = "";
      if (filter) filter.value = "全部";
      activeStatusFilter = "全部";
      renderCaseListOnly();
    }

    function getStatus(item) {
      const w = item.workflow;
      if (w.documents_status !== "资料已满足") return "待收集资料";
      if (w.agreement_status !== "已签") return "待签购房协议";
      if (w.deposit_status !== "已确认" || w.final_payment_status !== "已确认") return "等待款项";
      if (w.online_signing_status !== "已办结") return "待办理网签";
      if (w.certificate_status !== "已领取") return "待办理房产证";
      if (w.owner_notification_status !== "已通知") return "待通知取证";
      return "购房结束";
    }

    function nextActionText(item) {
      const status = getStatus(item);
      const map = {
        "待收集资料": "收集购房人身份证、户口本、婚姻资料等",
        "待签购房协议": "组织住户现场签订购房协议",
        "等待款项": "等待财务通知款项到账",
        "待办理网签": "预约并办理政务大厅网签",
        "待办理房产证": "办理房产证",
        "待通知取证": "通知用户领取房产证",
        "购房结束": "购房流程已结束"
      };
      return map[status];
    }

    function workflowValue(item, key) {
      if (key === "selection_status") return "已选房";
      if (key === "payment_status") {
        return item.workflow.deposit_status === "已确认" && item.workflow.final_payment_status === "已确认" ? "已确认" : "未确认";
      }
      if (key === "completion_status") {
        return getStatus(item) === "购房结束" ? "已结束" : "未结束";
      }
      return item.workflow[key];
    }

    function missingDocs(item) {
      return requiredDocs.filter(doc => !item.docs.some(name => name.includes(doc)));
    }

    function syncDocumentStatus(item) {
      item.workflow.documents_status = missingDocs(item).length === 0 ? "资料已满足" : "待收集资料";
    }

    function paymentSummary(item) {
      if (item.workflow.deposit_status !== "已确认" || item.workflow.final_payment_status !== "已确认") return "等待款项";
      return "款项已确认";
    }

    function certificateSummary(item) {
      if (item.workflow.certificate_status !== "已领取") return "待办理";
      if (item.workflow.owner_notification_status !== "已通知") return "待通知取证";
      return "已通知取证";
    }

    function countStatus(status) {
      return cases.filter(c => getStatus(c) === status).length;
    }

    function getSelectedCase() {
      return cases.find(c => c.id === selectedCaseId) || cases[0];
    }

    function badge(value) {
      let tone = "info";
      if (["未确认", "未签", "未办理", "未领取", "未通知", "未结束", "待配置", "待增强", "待通知", "等待款项", "待办理"].includes(value)) tone = "warn";
      if (String(value).includes("缺") || String(value).includes("待收集")) tone = "danger";
      if (String(value).includes("已") || value === "成功" || value === "资料已满足" || value === "款项已确认") tone = "ok";
      if (value === "购房结束") tone = "gray";
      return `<span class="badge ${tone}">${value}</span>`;
    }

    function maskId(id) {
      if (!id || id.length < 10) return "********";
      return `${id.slice(0, 6)}********${id.slice(-4)}`;
    }

    function money(value) {
      return `¥${Number(value || 0).toLocaleString("zh-CN")}`;
    }

    function val(id) {
      return document.getElementById(id).value.trim();
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function nowText() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function compactTime() {
      return nowText().replace(/[-:\s]/g, "");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }
  </script>
</body>
</html>
