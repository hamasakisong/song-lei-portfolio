<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1b2b40;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8e1ec;background:#fff;color:#23405c;border-radius:9px;padding:9px 14px;font-weight:600}button:hover{border-color:#4d91e8;color:#0864d3}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#176edc;border-color:#176edc;color:#fff}.danger{color:#b93e3b}.shell{display:flex;min-height:100vh}.side{width:228px;background:#14263d;color:#e8f0f8;flex:none;padding:22px 12px;display:flex;flex-direction:column}.brand{text-align:center;margin-bottom:22px}.brand img{width:48px;height:48px;display:block;margin:0 auto 10px}.brand strong{display:block;line-height:1.45}.brand small{color:#9eb5cc}nav{display:grid;gap:3px}.group{font-size:11px;color:#748da8;margin:12px 13px 4px}nav button{border:0;background:none;color:#afc0d2;text-align:left;padding:10px 13px;font-size:13px}nav button.on,nav button:hover{background:#274b75;color:#fff}.side-foot{margin-top:auto;border-top:1px solid #37516e;padding:15px 8px 0;font-size:11px;color:#a7bad0}.main{flex:1;min-width:0;padding:27px 32px}.top{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.top h1{font-size:24px;margin:0 0 6px}.top p{margin:0;color:#8394a5;font-size:13px}.pill{background:#e9f3ff;color:#1764bd;border-radius:30px;padding:7px 11px;font-size:12px}.panel{background:#fff;border:1px solid #e5ebf2;border-radius:14px;padding:21px;margin-bottom:17px;box-shadow:0 4px 20px #1e3d5b08}h2{font-size:17px;margin:0 0 16px}h3{font-size:15px;margin:0 0 12px}.muted{color:#8799ac;font-size:13px}.row{display:flex;gap:11px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.row button,.row .fixed{flex:none}.field{display:grid;gap:6px;color:#667b90;font-size:12px;font-weight:600}input,select,textarea{width:100%;border:1px solid #d7e1eb;border-radius:8px;padding:10px 11px;background:#fff;color:#1c3149}textarea{min-height:70px;resize:vertical}.two{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(315px,.85fr);gap:17px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stat{background:#f7faff;border:1px solid #e4ebf3;border-radius:10px;padding:16px}.stat small{color:#75899f}.stat b{display:block;font-size:23px;margin-top:8px}.list{max-height:370px;overflow:auto}.select-row,.bill-row{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:13px 15px;margin:7px 0;border:1px solid #e0e8f0;border-radius:9px;background:#fff}.select-row.on,.bill-row.on{border-color:#2176e6;background:#eef6ff}.select-row small,.bill-row small{display:block;color:#879aaf;font-weight:400;margin-top:4px}.money{color:#176edc;font-weight:750}.big{font-size:30px}.summary{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f5}.summary strong{white-space:nowrap}.divider{border-top:1px solid #e9eef4;margin:16px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#8294a7;background:#f7f9fc;font-weight:600}td,th{padding:13px 10px;border-bottom:1px solid #edf1f6;white-space:nowrap}tr.clickable{cursor:pointer}tr.clickable:hover{background:#eff6ff}.link{border:0;background:none;padding:3px;color:#176edc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.notice{background:#e9f3ff;color:#2264ad;padding:12px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}.warn{background:#fff1e9;color:#99613b}.empty{text-align:center;padding:34px;color:#96a7b7}.modal-bg{position:fixed;inset:0;background:#122338a6;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:white;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:17px;padding:27px;box-shadow:0 22px 70px #06172c55}.modal.wide{width:min(840px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.modal-head h2{font-size:20px}.modal .close{border:0;font-size:23px;padding:1px 7px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button.on{background:#e9f3ff;color:#176edc;border-color:#76b2ee}.qr{width:192px;height:192px;margin:18px auto;border:10px solid white;outline:1px solid #dae3ed;background:repeating-conic-gradient(#1c3149 0 25%,#fff 0 50%) 0 0/22px 22px}.callout{padding:13px;border-left:3px solid #176edc;background:#f5f9ff;color:#63788f;font-size:13px;margin-top:16px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:#8093a7}.pager button{padding:6px 10px}.toast{position:fixed;right:24px;bottom:24px;background:#173c64;color:#fff;padding:12px 18px;border-radius:9px;z-index:30;box-shadow:0 8px 24px #173c6444}@media(max-width:1050px){.two,.stats{grid-template-columns:1fr 1fr}}@media(max-width:720px){.side{width:65px;padding:12px 4px}.brand strong,.brand small,.group,.side-foot{display:none}.brand img{width:40px;height:40px}nav button{font-size:0;height:42px;overflow:hidden}nav button:first-letter{font-size:14px}.main{padding:17px}.top{display:block}.stats,.two{grid-template-columns:1fr}}

<body><div id="app"></div>
<script>
const nav=[['工作台','dashboard','首页驾驶舱'],['工作台','cashier','综合缴费管理'],['抄表出账','billing','账单信息录入'],['抄表出账','batches','抄表批次查询'],['综合查询','rooms','房屋信息查询'],['综合查询','utility','账单信息查询'],['综合查询','orders','订单信息查询'],['综合查询','payments','收款流水明细'],['综合查询','flows','渠道流水查询'],['财务处理','refunds','退款与账单纠错'],['财务处理','daily','日结查询'],['财务处理','recon','渠道对账'],['系统维护','master','基础信息管理'],['系统维护','operators','操作员管理'],['系统维护','permissions','权限分配']];
const rooms=[{id:'r1',project:'万福一区',building:'1#',number:'1-101',owner:'王志远',area:89.5,phone:'13800001001',card:'142201********1234',water:'WF1-W-001',electric:'WF1-E-001'},{id:'r2',project:'万福一区',building:'1#',number:'1-102',owner:'郭春燕',area:96.2,phone:'13800001002',card:'142201********2235',water:'WF1-W-002',electric:'WF1-E-002'},{id:'r3',project:'万福二区',building:'2#',number:'1-101',owner:'许海燕',area:113.4,phone:'13800002001',card:'142201********3236',water:'WF2-W-001',electric:'WF2-E-001'}];
const bills=[{id:'b1',room:'r1',fee:'PROPERTY',period:'2026',amount:2685,description:'2026 年物业费',status:'UNPAID'},{id:'b2',room:'r1',fee:'WATER',period:'2026-09',amount:20.10,description:'用量 6 m³ · 供水 14.40 + 污水 5.70',status:'UNPAID'},{id:'b3',room:'r1',fee:'ELECTRIC',period:'2026-09',amount:136.29,description:'用量 270 kWh · 居民阶梯',status:'UNPAID'},{id:'b4',room:'r2',fee:'PROPERTY',period:'2026',amount:2886,description:'2026 年物业费',status:'UNPAID'},{id:'b5',room:'r3',fee:'WATER',period:'2026-09',amount:30.15,description:'用量 9 m³',status:'UNPAID'}];
const state={page:'dashboard',project:'万福一区',room:'r1',selected:new Set(),orders:[],payments:[],flows:[],refunds:[],corrections:[],batches:[],operators:[{id:'u1',name:'张敏',role:'收银员',scope:'万福一区',enabled:true},{id:'u2',name:'李会计',role:'财务',scope:'全部小区',enabled:true}],modal:null,channel:'WECHAT',query:'',feeFilter:'ALL',pageNo:1,tab:'小区与楼幢',reconciled:false,propertyGenerated:true};
const $=s=>document.querySelector(s),fmt=n=>'¥'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fee=c=>({PROPERTY:'物业费',WATER:'水费',ELECTRIC:'电费',TEMP:'临时收费'})[c]||c,room=id=>rooms.find(r=>r.id===id),bill=id=>bills.find(b=>b.id===id),order=id=>state.orders.find(o=>o.id===id);
const paidAmount=b=>state.payments.flatMap(p=>p.items||[]).filter(i=>i.billId===b.id).reduce((a,i)=>a+i.amount,0)-state.refunds.filter(r=>r.billId===b.id&&r.status==='已完成').reduce((a,r)=>a+r.amount,0)-state.corrections.filter(c=>c.billId===b.id&&['现金已退','已复核'].includes(c.status)).reduce((a,c)=>a+c.amount,0);
const effective=b=>b.amount-state.refunds.filter(r=>r.billId===b.id&&r.reasonType==='DISCOUNT'&&['待执行','已完成'].includes(r.status)).reduce((a,r)=>a+r.amount,0)-state.corrections.filter(c=>c.billId===b.id&&c.status!=='待审批').reduce((a,c)=>a+c.amount,0);
const due=b=>Math.max(0,effective(b)-paidAmount(b));const allDue=()=>bills.filter(b=>b.status==='UNPAID'&&due(b)>0);
function table(head,rows,empty='暂无记录'){return '<div class="table-wrap"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+((rows.length?rows:['<td colspan="'+head.length+'" class="empty">'+empty+'</td>']).map(r=>'<tr class="clickable">'+r+'</tr>').join(''))+'</tbody></table></div>'}
function pager(rows,renderRows){const size=10,start=(state.pageNo-1)*size,slice=rows.slice(start,start+size);return renderRows(slice)+'<div class="pager"><button data-a="prev" '+(state.pageNo===1?'disabled':'')+'>上一页</button>第 '+state.pageNo+' 页<button data-a="next" '+(start+size>=rows.length?'disabled':'')+'>下一页</button></div>'}
function filterBar(extra=''){return '<div class="panel"><div class="row"><label class="field">小区<select id="project"><option>万福一区</option><option>万福二区</option></select></label><label class="field">房号 / 姓名 / 订单号<input id="query" value="'+esc(state.query)+'" placeholder="输入查询内容"></label>'+extra+'<button class="primary fixed" data-a="search">查询</button></div></div>'}
function issueMonth(b){if(b.fee==='PROPERTY')return b.period+'-01';if(b.fee==='TEMP')return b.period;const [year,month]=b.period.split('-').map(Number),date=new Date(year,month,1);return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')}
function dashboard(){
  const month=state.dashboardMonth||'2026-10';
  const all=bills.filter(b=>room(b.room).project===state.project&&b.status==='UNPAID');
  const current=all.filter(b=>issueMonth(b)===month);
  const rate=rows=>{const receivable=rows.reduce((a,b)=>a+effective(b),0),received=rows.reduce((a,b)=>a+paidAmount(b),0);return receivable?(received/receivable*100).toFixed(1)+'%':'—'};
  const monthlyPayments=state.payments.filter(p=>room(p.roomId).project===state.project&&p.time.startsWith(month));
  const paid=monthlyPayments.reduce((a,p)=>a+p.amount,0);
  const refunds=state.refunds.filter(r=>r.status==='已完成'&&room(bill(r.billId).room).project===state.project).reduce((a,r)=>a+r.amount,0);
  const corrections=state.corrections.filter(c=>['现金已退','已复核'].includes(c.status)&&room(bill(c.billId).room).project===state.project).reduce((a,c)=>a+c.amount,0);
  return '<div class="panel"><div class="row"><label class="field">小区<select id="project"><option>万福一区</option><option>万福二区</option></select></label><label class="field">统计月份<input id="dashboardMonth" type="month" value="'+month+'"></label><button class="primary fixed" data-a="search">刷新数据</button></div></div><div class="stats">'+[['当期收缴率',rate(current)],['累计收缴率',rate(all)],['本月原收款',fmt(paid)],['已实际退款',fmt(refunds+corrections)],['欠费总额',fmt(all.reduce((a,b)=>a+due(b),0))]].map(x=>'<div class="stat"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="two" style="margin-top:17px"><div class="panel"><h2>当期账单按项目</h2>'+['PROPERTY','WATER','ELECTRIC','TEMP'].map(c=>'<div class="summary"><span>'+fee(c)+'</span><strong>'+fmt(current.filter(b=>b.fee===c).reduce((a,b)=>a+effective(b),0))+'</strong></div>').join('')+'</div><div class="panel"><h2>所选月资金流水</h2>'+['CASH','WECHAT','ALIPAY'].map(c=>'<div class="summary"><span>'+channelName(c)+'</span><strong>'+fmt(monthlyPayments.filter(p=>p.channel===c).reduce((a,p)=>a+p.amount,0))+'</strong></div>').join('')+'</div></div>'
}
function channelName(c){return({CASH:'现金',WECHAT:'微信',ALIPAY:'支付宝'})[c]||c}
function cashier(){const r=room(state.room),found=rooms.filter(x=>x.project===state.project&&(!state.query||[x.number,x.owner,x.phone].some(v=>v.includes(state.query)))),available=bills.filter(b=>b.room===r.id&&due(b)>0&&b.status==='UNPAID'&&(state.feeFilter==='ALL'||b.fee===state.feeFilter)),chosen=[...state.selected].map(bill).filter(Boolean),total=chosen.reduce((a,b)=>a+due(b),0);return '<div class="two"><div><div class="panel"><h2>① 查找房号</h2><div class="row"><label class="field">小区<select id="project"><option>万福一区</option><option>万福二区</option></select></label><label class="field">楼栋<select id="building"><option>全部楼栋</option><option>1#</option><option>2#</option></select></label><label class="field">房号 / 姓名 / 手机号<input id="query" value="'+esc(state.query)+'" placeholder="查找房号"></label><button class="primary fixed" data-a="search">查询</button></div><div class="list" style="margin-top:13px">'+found.map(x=>'<button class="select-row '+(x.id===r.id?'on':'')+'" data-a="chooseRoom" data-id="'+x.id+'"><span><b>'+x.building+' · '+x.number+'</b><small>'+x.project+' · '+x.owner+'</small></span><span>'+(x.id===r.id?'已选中':'选择 →')+'</span></button>').join('')+'</div></div><div class="panel"><h2>② 选择待缴账单</h2><div class="tabs">'+['ALL','PROPERTY','WATER','ELECTRIC','TEMP'].map(c=>'<button data-a="feeFilter" data-id="'+c+'" class="'+(state.feeFilter===c?'on':'')+'">'+(c==='ALL'?'全部':fee(c))+'</button>').join('')+'</div><div class="list">'+(available.length?available.map(b=>'<button class="bill-row '+(state.selected.has(b.id)?'on':'')+'" data-a="toggleBill" data-id="'+b.id+'"><span><b>'+(state.selected.has(b.id)?'☑':'□')+' '+fee(b.fee)+' · '+b.period+'</b><small>'+esc(b.description)+'</small></span><strong class="money">'+fmt(due(b))+'</strong></button>').join(''):'<div class="empty">该房号当前没有待缴账单</div>')+'</div></div></div><div class="panel"><h2>本次收款</h2><p class="muted">'+r.project+' · '+r.building+' · '+r.number+'</p>'+chosen.map(b=>'<div class="summary"><span>'+fee(b.fee)+' · '+b.period+'</span><strong>'+fmt(due(b))+'</strong></div>').join('')+'<div class="summary"><b>合计应收</b><b class="money big">'+fmt(total)+'</b></div><button class="primary" style="width:100%;margin-top:17px" data-a="createOrder" '+(!chosen.length?'disabled':'')+'>确认并打开收款窗口</button><div class="divider"></div><h3>临时收费开单</h3><p class="muted">维修、排污等收费需写明服务内容和计费依据。</p><button data-a="temporary">新增临时收费</button></div></div>'}
function billing(){return '<div class="panel"><h2>物业费年度账单</h2><p>2026 年 · 万福一区　已生成：'+(state.propertyGenerated?'是':'否')+'</p><div class="notice warn">生成前先核对年度状态。重复点击不会再生成同一房号、同一年度的账单。</div><button data-a="propertyGenerate">生成年度账单</button></div><div class="panel"><h2>水电月账单：导入 → 复核 → 预览 → 发布</h2><div class="row"><label class="field">账期<input type="month" value="2026-09"></label><label class="field">介质<select id="medium"><option>水费</option><option>电费</option></select></label><button data-a="downloadTemplate" class="fixed">下载 Excel 模板</button><button data-a="importBatch" class="primary fixed">导入抄表批次</button></div><div class="actions"><button data-a="preview">预览计费</button><button data-a="publish">发布账单</button></div><div class="callout">读数按次月 1—5 日人工抄表；异常房号暂缓，正常房号可以先出账。</div></div>'}
function batches(){return filterBar('<label class="field">账期<input type="month" value="2026-09"></label>')+'<div class="panel"><h2>抄表批次</h2>'+pager(state.batches,x=>table(['批次号','账期','介质','导入行','成功','失败','操作'],x.map(b=>'<td>'+b.id+'</td><td>'+b.period+'</td><td>'+b.medium+'</td><td>'+b.rows.length+'</td><td>'+b.rows.filter(r=>r.ok).length+'</td><td>'+b.rows.filter(r=>!r.ok).length+'</td><td><button class="link" data-a="batchDetail" data-id="'+b.id+'">查看详情</button></td>'),'先在账单信息录入页导入一个抄表批次'))+'</div>'}
function roomPage(){const found=rooms.filter(r=>r.project===state.project&&(!state.query||[r.number,r.owner,r.phone].some(v=>v.includes(state.query))));return filterBar('<label class="field">楼栋<select><option>全部楼栋</option><option>1#</option><option>2#</option></select></label>')+'<div class="panel"><h2>房号列表</h2>'+pager(found,x=>table(['小区','楼栋','房号','主产权人','合同面积','操作'],x.map(r=>'<td>'+r.project+'</td><td>'+r.building+'</td><td>'+r.number+'</td><td>'+r.owner+'</td><td>'+r.area.toFixed(2)+'㎡</td><td><button class="link" data-a="roomDetail" data-id="'+r.id+'">查看详情</button></td>')))+'</div>'}
function utility(){const rows=bills.filter(b=>['WATER','ELECTRIC'].includes(b.fee)&&room(b.room).project===state.project&&(!state.query||room(b.room).number.includes(state.query)));return filterBar('<label class="field">账期<input type="month" value="2026-09"></label>')+'<div class="panel"><h2>水电月账单</h2>'+pager(rows,x=>table(['房号','项目','账期','应收','缴费状态','缴费方式','操作'],x.map(b=>'<td>'+room(b.room).number+'</td><td>'+fee(b.fee)+'</td><td>'+b.period+'</td><td>'+fmt(effective(b))+'</td><td>'+(due(b)?'待缴':'已结清')+'</td><td>'+((state.payments.find(p=>p.items.some(i=>i.billId===b.id))||{}).channel||'—')+'</td><td><button class="link" data-a="billDetail" data-id="'+b.id+'">详情</button></td>')))+'</div>'}
function orders(){let rows=state.orders.filter(o=>room(o.roomId).project===state.project&&(!state.query||[o.no,room(o.roomId).number].some(v=>v.includes(state.query))));return filterBar('<label class="field">状态<select><option>全部状态</option><option>待支付</option><option>支付成功</option></select></label>')+'<div class="panel"><h2>订单列表</h2>'+pager(rows,x=>table(['订单号','房号','账单数','原金额','支付方式','状态','操作'],x.map(o=>'<td>'+o.no+'</td><td>'+room(o.roomId).number+'</td><td>'+o.items.length+'</td><td>'+fmt(o.amount)+'</td><td>'+channelName(o.channel)+'</td><td>'+o.status+'</td><td><button class="link" data-a="orderDetail" data-id="'+o.id+'">查看订单</button></td>'),'收款后将在这里查看订单详情'))+'</div>'}
function payments(){return filterBar('<label class="field">支付方式<select><option>全部</option><option>现金</option><option>微信</option><option>支付宝</option></select></label>')+'<div class="panel"><h2>每一笔资金入账记录</h2>'+pager(state.payments.filter(p=>room(p.roomId).project===state.project),x=>table(['入账时间','订单号','房号','金额','方式','渠道交易号','操作员'],x.map(p=>'<td>'+p.time+'</td><td><button class="link" data-a="orderDetail" data-id="'+p.orderId+'">'+order(p.orderId).no+'</button></td><td>'+room(p.roomId).number+'</td><td>'+fmt(p.amount)+'</td><td>'+channelName(p.channel)+'</td><td>'+(p.flowNo||'—')+'</td><td>张敏</td>'),'暂无入账流水'))+'</div>'}

function payDialog(){const o=order(state.modal?.orderId);if(!o)return;const options=['WECHAT','ALIPAY','CASH'].map(c=>'<button class="'+(state.channel===c?'on':'')+'" data-a="payChannel" data-id="'+c+'">'+channelName(c)+'</button>').join('');show('收款 · '+room(o.roomId).number+'@@<div class="money big">'+fmt(o.amount)+'</div><p class="muted">'+o.items.length+' 张账单 · '+o.no+'</p><div class="tabs">'+options+'</div>'+(state.channel==='CASH'?'<label class="field">实际收到现金<input id="cashReceived" type="number" step="0.01" placeholder="至少 '+o.amount.toFixed(2)+'"></label><div class="actions"><button class="primary" data-a="finishPay" data-id="'+o.id+'">确认现金收款</button><button data-a="closeOrder" data-id="'+o.id+'">关闭待付订单</button></div>':'<div class="qr" aria-label="二维码交互位置"></div><p class="muted">扫码入口在运行系统中生成真实可扫描的测试码；本页仅评审收款步骤。</p><div class="actions"><button class="primary" data-a="finishPay" data-id="'+o.id+'">模拟扫码支付成功</button><button data-a="closeOrder" data-id="'+o.id+'">关闭待付订单</button></div>'));state.modal.orderId=o.id}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;try{if(a==='navigate'){state.page=id;state.pageNo=1;state.modal=null;render()}else if(a==='closeModal')hide();else if(a==='search'){state.query=$('#query')?.value?.trim()||'';state.project=$('#project')?.value||state.project;state.pageNo=1;render()}else if(a==='chooseRoom'){state.room=id;state.selected.clear();render()}else if(a==='feeFilter'){state.feeFilter=id;render()}else if(a==='toggleBill'){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render()}else if(a==='createOrder'){const items=[...state.selected].map(bill).filter(Boolean).map(b=>({billId:b.id,amount:due(b)}));if(!items.length)return message('先选择待缴账单');const occupied=state.orders.find(x=>x.status==='待支付'&&x.items.some(i=>items.some(j=>j.billId===i.billId)));if(occupied){if(occupied.items.length===items.length&&occupied.items.every(i=>items.some(j=>j.billId===i.billId))){state.modal={orderId:occupied.id};payDialog()}else message('所选账单已有待支付订单，请先处理原订单');return}const o={id:'o'+(state.orders.length+1),no:'PC-20261011-'+String(state.orders.length+1).padStart(4,'0'),roomId:state.room,items,amount:items.reduce((v,i)=>v+i.amount,0),status:'待支付',channel:null};state.orders.push(o);state.selected.clear();state.modal={orderId:o.id};payDialog()}else if(a==='payChannel'){const oid=state.modal.orderId;state.channel=id;state.modal={orderId:oid};payDialog()}else if(a==='finishPay')pay(order(id));else if(a==='closeOrder'){const o=order(id);o.status='已关闭';hide();message('待付订单已关闭')}else if(a==='temporary')show('新增临时收费@@<div class="row"><label class="field">费用名称<input id="tmpName" value="维修费"></label><label class="field">金额<input id="tmpAmount" type="number" step="0.01" value="30"></label></div><label class="field" style="margin-top:12px">收款详细信息<textarea id="tmpDetail" placeholder="例如：厨房下水管疏通 1 次"></textarea></label><label class="field" style="margin-top:12px">计费依据<input id="tmpBasis" placeholder="现场确认单编号"></label><div class="actions"><button class="primary" data-a="saveTemporary">确认开单</button></div>');else if(a==='saveTemporary'){const n=$('#tmpName').value.trim(),amt=Number($('#tmpAmount').value),d=$('#tmpDetail').value.trim(),basis=$('#tmpBasis').value.trim();if(!n||!d||!basis||amt<=0||!Number.isInteger(amt*100))return message('名称、详细信息、依据和两位小数金额均必填');bills.push({id:'b'+(bills.length+1),room:state.room,fee:'TEMP',period:'2026-10',amount:amt,description:n+'：'+d+'；依据：'+basis,status:'UNPAID'});hide();message('临时收费已开单')}else if(a==='propertyGenerate')message('2026 年物业费已生成，重复操作不会产生第二张账单');else if(a==='downloadTemplate')message('模板字段：房号、表号、上期读数、本次读数、抄表时间、备注');else if(a==='importBatch'){const batch={id:'RB-202610-'+String(state.batches.length+1).padStart(3,'0'),period:'2026-09',medium:$('#medium')?.value||'水费',rows:[{meter:'WF1-W-001',value:'56.000',ok:true},{meter:'未知表号',value:'',ok:false}]};state.batches.push(batch);render();message('导入完成：1 条成功，1 条异常')}else if(a==='preview')show('水电计费预览@@<div class="summary"><span>水费 6 m³</span><b>供水 14.40 + 污水 5.70 = ¥20.10</b></div><div class="summary"><span>电费 270 kWh</span><b>81.09 + 47.43 + 7.77 = ¥136.29</b></div><div class="notice warn">异常行需修正并复核后才可出账。</div>');else if(a==='publish')message('符合条件的房号已发布，已有账单不会重复生成');else if(a==='batchDetail'){const x=state.batches.find(v=>v.id===id);show('批次详情 · '+id+'@@'+table(['表号','本次读数','处理结果'],x.rows.map(r=>'<td>'+r.meter+'</td><td>'+r.value+'</td><td>'+(r.ok?'导入成功':'异常：表号不存在')+'</td>')),true)}else if(a==='roomDetail')openRoom(room(id));else if(a==='billDetail'){const b=bill(id);show('账单详情 · '+fee(b.fee)+'@@<div class="summary"><span>房号/账期</span><b>'+room(b.room).number+' / '+b.period+'</b></div><div class="summary"><span>原应收</span><b>'+fmt(b.amount)+'</b></div><div class="summary"><span>有效应收 / 净已收</span><b>'+fmt(effective(b))+' / '+fmt(paidAmount(b))+'</b></div><p class="callout">'+esc(b.description)+'</p>')}else if(a==='orderDetail')openOrder(order(id));else if(a==='prev'){state.pageNo=Math.max(1,state.pageNo-1);render()}else if(a==='next'){state.pageNo++;render()}else if(a==='applyRefund'){const oid=$('#refundOrder').value;if(!oid)return message('先选择已支付订单');const o=order(oid);show('选择账单办理退款/差错@@'+o.items.map(i=>'<button class="select-row" data-a="refundBill" data-id="'+o.id+':'+i.billId+'"><span>'+fee(bill(i.billId).fee)+' · '+bill(i.billId).period+'</span><strong>'+fmt(i.amount)+'</strong></button>').join(''))}else if(a==='refundBill'){const [oid,bid]=id.split(':'),b=bill(bid);show((['WATER','ELECTRIC'].includes(b.fee)?'水电错收现金差错':'物业费/临时费退款')+'@@<p>'+fee(b.fee)+' · 原订单 '+order(oid).no+'</p><label class="field">退款/调减金额<input id="rfAmount" type="number" step="0.01" placeholder="不超过 '+fmt(b.amount)+'"></label><label class="field" style="margin-top:12px">原因与依据<textarea id="rfReason"></textarea></label>'+(!['WATER','ELECTRIC'].includes(b.fee)?'<label class="field" style="margin-top:12px">退款原因<select id="rfType"><option value="MISTAKE">误收</option><option value="DISCOUNT">减免</option></select></label>':'')+'<div class="actions"><button class="primary" data-a="saveRefund" data-id="'+oid+':'+bid+'">提交申请</button></div>')}else if(a==='saveRefund'){const [oid,bid]=id.split(':'),amt=Number($('#rfAmount').value),reason=$('#rfReason').value.trim(),b=bill(bid);if(!amt||amt<=0||amt>b.amount||!reason||!Number.isInteger(amt*100))return message('请填写有效金额及依据');if(['WATER','ELECTRIC'].includes(b.fee))state.corrections.push({id:'UC-'+(state.corrections.length+1),orderId:oid,billId:bid,amount:amt,reason,status:'待审批'});else state.refunds.push({id:'RF-'+(state.refunds.length+1),orderId:oid,billId:bid,amount:amt,reason,reasonType:$('#rfType').value,status:'待审批'});hide();message('已提交，等待异人审批')}else if(a==='approveRefund'){state.refunds.find(x=>x.id===id).status='待执行';render()}else if(a==='finishRefund'){const r=state.refunds.find(x=>x.id===id);r.status='已完成';state.reconciled=false;const o=order(r.orderId);if(o.channel!=='CASH')state.flows.push({no:'RR-'+r.id,orderNo:o.no,channel:o.channel,type:'退款',amount:r.amount,status:'成功',time:'2026-10-11 11:00'});render()}else if(a==='approveCorrection'){state.corrections.find(x=>x.id===id).status='待现金退还';render()}else if(a==='payCorrection'){state.corrections.find(x=>x.id===id).status='现金已退';render()}else if(a==='reviewCorrection'){state.corrections.find(x=>x.id===id).status='已复核';render()}else if(a==='runRecon'){state.reconciled=true;render()}else if(a==='reviewRecon')message('已记录财务复核，逐笔差异保留');else if(a==='masterTab'){state.tab=id;render()}else if(a==='addOperator'){const name=$('#opName').value.trim(),display=$('#opDisplay').value.trim();if(!name||!display)return message('账号和姓名必填');state.operators.push({id:'u'+(state.operators.length+1),name:display+'（'+name+'）',role:'未分配',scope:'未分配',enabled:false});render()}else if(a==='toggleOperator'){const o=state.operators.find(x=>x.id===id);if(!o.enabled&&o.role==='未分配')return message('先分配角色和小区范围');o.enabled=!o.enabled;render()}else if(a==='setPermission'){const o=state.operators.find(x=>x.id===id);show('权限分配 · '+o.name+'@@<label class="field">岗位<select id="permRole"><option>收银员</option><option>主管</option><option>财务</option></select></label><label class="field" style="margin-top:12px">小区范围<select id="permScope"><option>万福一区</option><option>万福二区</option><option>全部小区</option></select></label><div class="actions"><button class="primary" data-a="savePermission" data-id="'+id+'">保存并启用</button></div>')}else if(a==='savePermission'){const o=state.operators.find(x=>x.id===id);o.role=$('#permRole').value;o.scope=$('#permScope').value;o.enabled=true;hide();message('权限已生效')}}catch(err){console.error(err);message('原型操作失败：'+err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='project'){state.project=e.target.value;const r=rooms.find(x=>x.project===state.project);if(r)state.room=r.id;state.selected.clear();state.pageNo=1;render()}else if(e.target.id==='dashboardMonth'){state.dashboardMonth=e.target.value;render()}});
render();
</script></body></html>
